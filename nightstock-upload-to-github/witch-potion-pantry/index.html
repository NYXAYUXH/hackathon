<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />

    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Outfit:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script type="module" crossorigin src="./assets/index-CLYoE5U9.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BGrOJmaQ.css">
    <style>
      .orb-sphere-3d {
        width: 135px;
        height: 135px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 25%, rgba(255, 255, 255, 0.45) 0%, rgba(251, 191, 36, 0.3) 25%, rgba(147, 51, 234, 0.4) 55%, #0d071d 85%);
        box-shadow: inset 0 0 25px rgba(251, 191, 36, 0.5), inset 0 0 12px rgba(255, 255, 255, 0.6), 0 0 24px rgba(251, 191, 36, 0.35), 0 12px 28px rgba(0, 0, 0, 0.8);
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(255, 255, 255, 0.25);
        cursor: pointer;
        transition: transform 0.25s ease, box-shadow 0.25s ease;
      }
      .orb-sphere-3d:hover {
        transform: scale(1.05);
        box-shadow: inset 0 0 35px rgba(251, 191, 36, 0.7), 0 0 32px rgba(251, 191, 36, 0.5);
      }
      .orb-glare-3d {
        position: absolute;
        top: 12px;
        left: 22px;
        width: 35px;
        height: 18px;
        border-radius: 50%;
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.8), transparent 75%);
        transform: rotate(-30deg);
        pointer-events: none;
      }
      .orb-base-3d {
        width: 90px;
        height: 16px;
        background: linear-gradient(180deg, #451a03 0%, #170b02 100%);
        border-radius: 50%;
        margin-top: -8px;
        border: 1px solid rgba(245, 158, 11, 0.4);
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.8);
      }
      /* Reduce auto-writing / typewriter delay for crisp instantaneous UI */
      h1, h2, h3, p, span {
        animation-delay: 0s !important;
        transition-delay: 0s !important;
      }
    </style>
    <script>
      function enhanceCrystalBall() {
        const crystalSection = document.getElementById('crystal-ball');
        if (!crystalSection || document.getElementById('enhanced-orb-wrapper')) return;

        const orbHero = document.createElement('div');
        orbHero.id = 'enhanced-orb-wrapper';
        orbHero.className = 'my-4 p-4 rounded-xl bg-slate-950/70 border border-amber-500/30 flex flex-col sm:flex-row items-center gap-6';
        orbHero.innerHTML = `
          <div class="flex flex-col items-center shrink-0">
            <div class="orb-sphere-3d" title="Click to gaze into the future!" onclick="this.classList.toggle('scale-105');">
              <div class="orb-glare-3d"></div>
              <span class="text-3xl">🔮</span>
              <span class="text-xs font-bold text-amber-200 mt-1 uppercase tracking-wider">Crystal Ball</span>
              <span class="text-[10px] text-emerald-400 font-semibold bg-emerald-950/80 px-2 py-0.5 rounded-full border border-emerald-500/40 mt-1">● Radar Active</span>
            </div>
            <div class="orb-base-3d"></div>
          </div>
          <div class="flex-1 text-center sm:text-left">
            <div class="text-xs font-bold uppercase tracking-wider text-amber-400">🔮 Interactive Crystal Ball (Demand Oracle)</div>
            <h3 class="text-base font-bold text-white mt-0.5">3D Predictive Depletion Radar</h3>
            <p class="text-xs text-slate-300 mt-1 leading-relaxed">
              This spherical oracle calculates real-time consumption velocity, predicts depletion horizons before items reach zero, and scans for sudden surge spikes.
            </p>
          </div>
        `;

        const header = crystalSection.querySelector('div');
        if (header && header.nextSibling) {
          crystalSection.insertBefore(orbHero, header.nextSibling);
        } else {
          crystalSection.prepend(orbHero);
        }
      }

      const observer = new MutationObserver(enhanceCrystalBall);
      observer.observe(document.documentElement, { childList: true, subtree: true });
      window.addEventListener('DOMContentLoaded', enhanceCrystalBall);
    </script>
  </head>
  <body class="bg-[#090712] text-slate-100 antialiased selection:bg-amber-500/30 selection:text-amber-200">
    <div id="root"></div>
  </body>
</html>
